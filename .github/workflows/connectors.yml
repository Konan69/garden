name: Connectors

on:
  pull_request:
    paths:
      - 'packages/connectors/**'
      - 'packages/agent-runtime/src/runtime-mcp-controller.ts'
      - 'apps/web/src/lib/server/executor-engine/**'
      - 'apps/web/src/lib/server/executor-runtime.ts'
      - 'apps/web/src/routes/api/executor/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/connectors.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify connector coverage
        run: pnpm verify:connectors

      - name: Typecheck connector package
        run: pnpm --filter @garden/connectors typecheck

      - name: Test connector package
        run: pnpm --filter @garden/connectors test
